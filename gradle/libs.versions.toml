# 回声音乐 EchoMusic · 版本目录（Version Catalog）
# 所有第三方版本集中在这里，改版本只动这一个文件。
# 选型依据见 docs/ADR-0001-tech-stack.md；组合兼容性（2026-09 核实）：
#   AGP 8.13.2  要求 Gradle >= 8.13
#   Kotlin 2.4.0 官方实测 Gradle 7.6.3 ~ 9.5.0，最低 AGP 8.5.2
#   Compose BOM 2026.06.01 = Compose ui 1.11.4 / material3 1.4.0（AAR 元数据实测 minCompileSdk=35，
#     是最后一个支持 compileSdk 36 的稳定 BOM；2026.08.00 起的 Compose 1.12 要求 compileSdk 37，
#     等项目决定升级 compileSdk 时再随 BOM 一起动）
#   Media3 1.11.0（2026-07-29 稳定版）

[versions]
agp = "8.13.2"
# 2.4 稳定线的最新补丁版（2.4.0 于 2026-06 发布，官方实测 Gradle 7.6.3~9.5.0）
kotlin = "2.4.10"
composeBom = "2026.06.01"
media3 = "1.11.0"
activityCompose = "1.13.0"

[libraries]
# Compose：只写 BOM 版本，下面各 compose 构件不带版本号，统一由 BOM 仲裁
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

# Media3（ADR-0001 选定的播放内核，M1 起使用；M0 先锁版本）
androidx-media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
androidx-media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
# Kotlin 2.0 起 Compose 编译器随 Kotlin 一起发布，插件版本号 = Kotlin 版本号
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
