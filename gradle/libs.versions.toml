# 回声音乐 EchoMusic · 版本目录（Version Catalog）
# 所有第三方版本集中在这里，改版本只动这一个文件。
# 选型依据见 docs/ADR-0001-tech-stack.md；组合兼容性（2026-09 核实）：
#   AGP 8.13.2  要求 Gradle >= 8.13
#   Kotlin 2.4.0 官方实测 Gradle 7.6.3 ~ 9.5.0，最低 AGP 8.5.2
#   Compose BOM 2026.06.01 = Compose ui 1.11.4 / material3 1.4.0（AAR 元数据实测 minCompileSdk=35，
#     是最后一个支持 compileSdk 36 的稳定 BOM；2026.08.00 起的 Compose 1.12 要求 compileSdk 37，
#     等项目决定升级 compileSdk 时再随 BOM 一起动）
#   Media3 1.11.0（2026-08-05 稳定版，官方 releases 页为准）

[versions]
agp = "8.13.2"
# 2.4 稳定线的最新补丁版（2.4.0 于 2026-06 发布，官方实测 Gradle 7.6.3~9.5.0）
kotlin = "2.4.10"
composeBom = "2026.06.01"
media3 = "1.11.0"
activityCompose = "1.13.0"

# ---- M1 T0 依赖门禁（ADR-0004 六决策，2026-09-05 经 Maven Central/Google Maven 逐一核实）----
# KSP：2.x 起与 Kotlin 版本解耦，采用独立版本号（不再有 "2.4.10-x.y" 形式）。
#   2.3.10 是官方文档与 Kotlin 2.4.10 的配对版本（2026-07-09 发布）；2.3.11 更新但非门禁实测版本。
ksp = "2.3.10"
# Koin 4.1.1（D6 回退落点，T0 门禁实测结论 2026-09-05）：
#   Hilt 2.60.1 门禁失败——其 Gradle 插件自 2.59 起强制要求 AGP >= 9.0.0（本工程实测报错
#   "Hilt Android Gradle plugin is only compatible with AGP version 9.0.0 or higher (found 8.13.2)"），
#   与工程锁定的 AGP 8.13.2 冲突；而降到 Hilt <= 2.58 内置的 Kotlin 元数据读取器过旧，
#   无法安全消费 Kotlin 2.4.10 源码（即 ADR-0004 R1 本尊）。按 D6 既定回退线切 Koin 4.1.1，
#   纯 Kotlin DSL、零编译期处理器；升级 AGP 9.2+ 后可重评 Hilt（届时一并升 compileSdk 37）。
koin = "4.1.1"
# Room3：D4 决策，新包 androidx.room3（coroutines-only，ktx 已并入 runtime，AAR minCompileSdk=34）
room3 = "3.0.2"
# androidx.sqlite：Room3 3.0.2 传递依赖 2.7.0；BundledSQLiteDriver（JVM 单测内存库）在此构件
sqlite = "2.7.0"
# Preferences DataStore：D4 决策（1.3.0 目前只有 alpha，不采用）
datastore = "1.2.1"
# Coil：D5 决策原锁 3.6.2，但实测 3.6.0+ 传递 org.jetbrains.compose.foundation:1.12.0
#   → androidx.compose.foundation 1.12.0（AAR 元数据 minCompileSdk=37 / minAGP=9.1.0），
#   与 compileSdk 36 / AGP 8.13.2 冲突。按 ADR-0004 回退原则降至 3.5.0
#   （传递 compose foundation 1.11.1 线，与 Compose BOM 2026.06.01 兼容）。
#   升回 3.6.x 需与 compileSdk 37 / AGP 9.2+ 升级同批进行。
coil = "3.5.0"
# MaterialKolor：T9 取色器只用其 HCT 数学库 material-color-utilities（纯 Kotlin，无 Compose 依赖）。
#   5.0.x 全线（含 material-kolor 与 material-color-utilities 的 android 变体）AAR 实测
#   minCompileSdk=37，与 compileSdk 36 冲突；按回退原则降至 4.1.1（minCompileSdk=1，实测 AAR）。
#   升回 5.x 与 Coil 3.6.x / lifecycle 2.11 / Hilt 2.60 同批（compileSdk 37 + AGP 9.2+）。
materialkolor = "4.1.1"
# Lifecycle：2.11.0（2026-06-17 stable）要求 compileSdk 37 / AGP 9.2+，2.10.0（minCompileSdk=35）
#   是与 compileSdk 36 兼容的最新稳定版
lifecycle = "2.10.0"
# JVM 单测框架（T0 起 Room3 DAO 内存库测试用）
junit = "4.13.2"

[libraries]
# Compose：只写 BOM 版本，下面各 compose 构件不带版本号，统一由 BOM 仲裁
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

# Media3（ADR-0001 选定的播放内核，M1 起使用；M0 先锁版本）
androidx-media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
androidx-media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }

# Lifecycle（T6/T7 状态桥与 collectAsStateWithLifecycle 用）
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }

# Koin（D6 回退落点：DSL service locator，无 KSP/kapt 处理器；T6+ 的 ViewModel 注入走 koin-androidx-compose）
koin-android = { group = "io.insert-koin", name = "koin-android", version.ref = "koin" }
koin-androidx-compose = { group = "io.insert-koin", name = "koin-androidx-compose", version.ref = "koin" }

# Room3（D4：新包 androidx.room3，无 ktx 构件——coroutines 支持已并入 runtime）
androidx-room3-runtime = { group = "androidx.room3", name = "room3-runtime", version.ref = "room3" }
androidx-room3-compiler = { group = "androidx.room3", name = "room3-compiler", version.ref = "room3" }
# JVM 单测内存库驱动（BREAKDOWN §3.1：Room3 + BundledSQLiteDriver 免模拟器跑 DAO 测试）
androidx-sqlite-bundled = { group = "androidx.sqlite", name = "sqlite-bundled", version.ref = "sqlite" }
# 单测必须显式用 -jvm 构件：AGP 对单测配置默认 androidJvm 变体兼容（为 Robolectric 设计），
# android 变体的驱动只走 System.loadLibrary（APK 内取 so），纯 JVM 上必然 UnsatisfiedLinkError；
# -jvm 构件内置 NativeLibraryLoader，从 classpath 抽取 natives/<平台>/libsqliteJni 到临时目录。
androidx-sqlite-bundled-jvm = { group = "androidx.sqlite", name = "sqlite-bundled-jvm", version.ref = "sqlite" }

# Preferences DataStore（D4：设置键值存储，T4 接入）
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# Coil（D5：封面加载；T7/T8 消费 AsyncImage）
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }

# MaterialKolor（D5/T9：HCT 取色数学库，纯 JVM 可单测）
materialkolor-color-utilities = { group = "com.materialkolor", name = "material-color-utilities", version.ref = "materialkolor" }

# 测试
junit = { group = "junit", name = "junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
# Kotlin 2.0 起 Compose 编译器随 Kotlin 一起发布，插件版本号 = Kotlin 版本号
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# KSP2（注解处理统一走 KSP：Room3 单处理器；Koin 回退后无 DI 处理器）
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
