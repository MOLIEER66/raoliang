# 回声音乐 EchoMusic · Gradle 全局配置

# JVM 参数：开发沙箱 4GB/2C 无 swap，2048m 堆 + Kotlin daemon 会触发 OOM killer
# （2026-09-27 实测：daemon disappeared unexpectedly）。CI runner 内存充裕不受影响；
# 1536m 对当前工程体量绰绰有余（实测 46 任务 < 5 分钟）。
org.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8

# Kotlin 编译守护进程独立堆限制（默认与 Gradle 分配叠加，4GB 机器的第二爆点）
kotlin.daemon.jvmargs=-Xmx1024m

# 并行 + 构建缓存：模块还少，收益小，但先养成习惯
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX 必开；R 类只保留本模块条目，加快编译并防止跨模块误引用
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin 官方代码风格
kotlin.code.style=official
